name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:app
      # Real PostgreSQL: ubuntu runners ship PostgreSQL binaries; the script starts a temporary cluster.
      - run: node scripts/pg-test-cluster.mjs with -- node --test apps/hyla-mini/tests/postgres.test.mjs apps/hyla-mini/tests/matrix.test.mjs
        env:
          SYNA_PG_BIN: /usr/lib/postgresql/16/bin
      # The gate's own tooling (step runner process groups, cluster script signal forwarding).
      - run: npm run test:scripts
        env:
          SYNA_PG_BIN: /usr/lib/postgresql/16/bin
      # The four core demos check their own results and print `demo: OK`.
      - run: npm run demo
      # Self-asserting three-cell demo (exit 1 unless every cell — HTTP alpha, HTTP beta, static alpha — answers 200 with the tenant's page).
      - run: npm run demo:hyla-mini

  # The release gate (G0 + G1: archive, rebuild from the archive, pack, consumer smoke, manifest) with
  # its outputs kept as a workflow artifact. First cloud run: 2026-09-05, run 33995206873 on 09e2931
  # (success; gate COMPLETE 710/710 on PostgreSQL 16 / Node 22). See work/v05/STATE.md.
  release-gate:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-v05.mjs --release
        env:
          SYNA_PG_BIN: /usr/lib/postgresql/16/bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syna-v0.5-release-gate
          if-no-files-found: warn
          path: |
            work/release/*.tar.gz
            work/release/*.zip
            work/release/pack/*.tgz
            validation/v0.5-release/
            RELEASE_MANIFEST.json

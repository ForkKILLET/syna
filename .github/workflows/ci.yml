name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:app
      # Real PostgreSQL: ubuntu runners ship PostgreSQL binaries; the script starts a temporary cluster.
      - run: node scripts/pg-test-cluster.mjs with -- node --test apps/hyla-mini/tests/postgres.test.mjs apps/hyla-mini/tests/matrix.test.mjs
        env:
          SYNA_PG_BIN: /usr/lib/postgresql/16/bin
      - run: npm run demo
      # Self-asserting four-cell demo (exit 1 unless every cell answers 200 with the tenant's page).
      - run: npm run demo:hyla-mini

  # The release gate (G0 + G1: archive, rebuild from the archive, pack, consumer smoke, manifest) with
  # its outputs kept as a workflow artifact. NOT VERIFIED IN THE CLOUD: this job was written and checked
  # locally (the workflow syntax and every script it calls run on the developer machine); the repository
  # had not been pushed when it was added, so no run of it exists. See work/v05/STATE.md.
  release-gate:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-v05.mjs --release
        env:
          SYNA_PG_BIN: /usr/lib/postgresql/16/bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syna-v0.5-release-gate
          if-no-files-found: warn
          path: |
            work/release/*.tar.gz
            work/release/*.zip
            work/release/pack/*.tgz
            validation/v0.5-release/
            RELEASE_MANIFEST.json
